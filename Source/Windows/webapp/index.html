<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-title" content="PCRemKey">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon.png">
<title>PCRemKey</title>
<style>
html,body{ margin: 0; padding: 0; }
body {
	font-family: Arial, sans-serif;
	user-select: none;
	background-color: #1a1a1a;
}
* {
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
	-webkit-tap-highlight-color: transparent;
}
:root { --topbar-h: 38px; }
#keyboard {
	position:fixed;
	bottom:0;
    max-width: 100%;
    width: 100%;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
}
.row {
    display: flex;
    justify-content: center;
    width: 100%;
}
.button {
	display: flex;
	justify-content: center;
	align-items: center;
	text-align: center;
	padding:0;
	flex: 1 1 0;
	height: calc(10vh - 6px);
	margin: 1px;
	font-size: 11px;
	cursor: pointer;
	border: none;
	background-color: #333333;
	color: #f8f8f8;
	outline: none;
}
.button:active{background-color:#4d4d4d;}
/* Включённый модификатор (Ctrl / Alt / Shift) */
.button.active, .button.active:active { background-color: #595959; color: #ffffff; }
.button img{max-width:10px; max-height:10px;}

#keys {
	display: flex;
	flex-direction: column;
	width: 100%;
}
/* Верхняя панель над клавиатурой */
#topbar {
	display: flex;
	justify-content: center;
	align-items: center;
	gap: 6px;
	height: var(--topbar-h);
	box-sizing: border-box;
	padding: 3px 0;
}
.top-btn {
	width: 52px;
	height: 100%;
	border-radius: 8px;
	background-color: #303030;
	color: #979797;
	display: flex;
	align-items: center;
	justify-content: center;
	font-size: 16px;
	cursor: pointer;
}
.top-btn:active { background-color: #4d4d4d; }
.top-btn.active, .top-btn.active:active { background-color: #595959; }
.top-btn img { max-width: 24px; max-height: 24px; }
#topClock {
	font-size: 16px;
	color: #555555;
	letter-spacing: 1px;
	min-width: 78px;
	text-align: center;
}

#remote {
	position: fixed;
	right: 140px;
	top: 50%;
	box-sizing: border-box;
	display: none;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	transform: translateY(calc(-50%)) rotate(-90deg);
}
#remoteClock {
	font-size: 18px;
	color: #3f3f3f;
	margin-bottom: 10px;
	letter-spacing: 1px;
}

.media-block {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 10px 0;
}
.media-center {
    display: flex;
    flex-direction: column;
    align-items: center;
}
.side-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 46px;
    flex-shrink: 0;
}
.remote-row {
	display: flex;
	justify-content: center;
	gap: 30px;
	margin: 8px 0;
}
.round-btn {
	width: 46px;
	height: 46px;
	border-radius: 50%;
	background-color: #333333;
	color: #f8f8f8;
	display: flex;
	align-items: center;
	justify-content: center;
	font-size: 16px;
}

.round-btn-sub {
	width: 38px;
	height: 38px;
	background-color: #303030;
	color: #979797;
}

.round-btn:active { background-color: #4d4d4d; }
.round-btn img {max-width:100%; max-height:100%;}
.dpad-row {
	display: flex;
	flex-direction: row;
	align-items: center;
	gap: 16px;
	margin: 10px 0;
}
#dpad {
	width: 180px;
	height: 180px;
	border-radius: 50%;
	background-color: #333333;
	position: relative;
	transition: background-color 0.1s ease;
}
#dpad.dragging {
	background-color: #4d4d4d;
}
#scrollpad {
	width: 46px;
	height: 180px;
	border-radius: 14px;
	background-color: #333333;
	position: relative;
	touch-action: none;
	display: flex;
	align-items: center;
	justify-content: center;
}
#scrollpad-dummy {
	width: 46px;
	height: 180px;
	position: relative;
}
.scrollpad-icon {
	color: #f8f8f8;
	font-size: 18px;
	pointer-events: none;
}
#dpad .dpad-center {
	position: absolute;
	left: 50%;
	top: 50%;
	width: 70px;
	height: 70px;
	border-radius: 50%;
	background-color: #1a1a1a;
	transform: translate(-50%, -50%);
	display: flex;
	align-items: center;
	justify-content: center;
	color: #f8f8f8;
	font-size: 14px;
}
.dpad-arrow {
	position: absolute;
	color: #f8f8f8;
	font-size: 22px;
	width: 30px;
	height: 30px;
	display: flex;
	align-items: center;
	justify-content: center;
}
.dpad-arrow.n { top: 8px; left: 50%; transform: translateX(-50%); }
.dpad-arrow.s { bottom: 8px; left: 50%; transform: translateX(-50%); }
.dpad-arrow.w { left: 8px; top: 50%; transform: translateY(-50%); }
.dpad-arrow.e { right: 8px; top: 50%; transform: translateY(-50%); }

@media (orientation: landscape) {
	.keyboard{
		margin-top: 0;
	}
    .button {
        height: calc((100vh - var(--topbar-h)) / 5 - 6px);
		font-size: 16px;
		margin: 3px;
    }
	.button img{max-width:18px; max-height:18px;}
}
</style>
<script src="layouts.js"></script>
<script>
let Server = '';

let ShiftPressed = false;
let CtrlPressed = false;
let AltPressed = false;
let KeyboardDiv; // контейнер: верхняя панель + клавиши
let KeysDiv;     // только клавиши
let CustomLang = 'en';
let CurrentLayoutLang = CustomLang;
let CurrentLayout;
let CurrentLayoutShift;
let MouseSensitivity = 1.3;
let FKeysMode = false; // true = в верхнем ряду вместо "1 2 3 ... - =" показаны F1-F12

let IsAndroid = false;

let RemoteDiv;
const RemoteMode = 0;
const KeyboardMode = 1;
let CurrentMode = RemoteMode; // KeyboardMode | RemoteMode
let TouchpadMode = true; // false = стрелки+Enter, true = тачпад (курсор)
let LastTouchX = 0, LastTouchY = 0, TouchMoved = false;
let JustStarted = false; // первое touchmove после touchstart не копим — гасит "проглоченный" браузером слоп
let PendingDx = 0, PendingDy = 0;
let LastFlushTime = 0;
let MouseMoveTimer = null;
const MOUSE_FLUSH_INTERVAL = 16; // мс, целевой интервал отправки (~60 Гц)
let MouseInFlight = 0; // сколько MOUSEMOVE-запросов сейчас в пути
const MOUSE_MAX_IN_FLIGHT = 2; // больше не шлём: движение копится и уходит одним пакетом, очередь не растёт
let LastScrollY = 0, ScrollAccum = 0;
const ScrollThreshold = 30; // px of swipe per one wheel notch

// Long-press-to-drag (зажатие ЛКМ для перетаскивания)
let DragHoldTimer = null;
let DragActive = false;
const DRAG_HOLD_DELAY = 400; // мс до срабатывания зажатия
const DRAG_MOVE_TOLERANCE = 3; // px, порог движения, отменяющий зажатие

const EnLayout = [

	['TAB', 'Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P', 'OEM_4', 'OEM_6', 'OEM_5'],

	['SHIFT', 'Z', 'X', 'C', 'V', 'B', 'N', 'M', 'OEM_COMMA', 'OEM_PERIOD', 'OEM_2', 'SHIFT'],

];

const EnLayoutTitles = [
	['Esc', '1', '2', '3', '4', '5', '6', '7', '8', '9', '0', '-', '=', '◄'],
	['Tab', 'q', 'w', 'e', 'r', 't', 'y', 'u', 'i', 'o', 'p', '[', ']', '\\'],
	['Caps Lock', 'a', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l', ';', '\'', 'Enter'],
	['Shift', 'z', 'x', 'c', 'v', 'b', 'n', 'm', ',', '.', '/', 'Shift'],
	['Ctrl', '🪟', 'Alt', '🌐', '', '←', '↑', '↓', '→', 'Del']
];

const EnLayoutTitlesShift = [
	['~', '!', '@', '#', '$', '%', '^', '&', '*', '(', ')', '_', '+', '`'],
	['Tab', 'Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P', '[', ']', '|'],
	['Caps Lock', 'A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L', ':', '"', 'Enter'],
	['Shift', 'Z', 'X', 'C', 'V', 'B', 'N', 'M', '<', '>', '?', 'Shift'],
	['Ctrl', '🪟', 'Alt', '🌐', '', '←', '↑', '↓', '→', 'Del']
];

// Other languages -> layouts.js

let IDS_ENTER_ADDRESS = 'Enter the IP address:';
let IDS_ENTER_LANG = 'Enter one of the languages\n(ru, zh-cn, zh-tw, es, pt-br, fr, de, ja, ar, it, ko):';
let IDS_ENTER_MOUSE_SENSITIVITY = 'Enter mouse sensitivity:';
let IDS_HELP = '"ALT + LANG" - switch the on-screen layout without sending a command.\n"CTRL + ALT + =" - change the secondary language.\n"CTRL + ALT + \\" - change mouse sensitivity.\n"CTRL + ALT + Backspace" - enter the address.';

const LangStrings = {
    ru: ['Введите IP адрес:', 'Введите один из языков\n(ru, zh-cn, zh-tw, es, pt-br, fr, de, ja, ar, it, ko):', 'Введите чувствительность мыши:', '"ALT + LANG" - смена экранной раскладки на ПК.\n"CTRL + ALT + =" - изменить второй язык.\n"CTRL + ALT + \\" - изменить чувствительность мыши." - ввод адреса.'],
    'zh-cn': ['输入 IP 地址:', '请输入语言之一\n(ru, zh-cn, zh-tw, es, pt-br, fr, de, ja, ar, it, ko):', '输入鼠标灵敏度:', '"ALT + LANG" - 切换电脑上的屏幕布局。\n"CTRL + ALT + =" - 更改第二语言。\n"CTRL + ALT + \\" - 更改鼠标灵敏度。'],
    'zh-tw': ['輸入 IP 位址:', '請輸入以下語言之一\n(ru, zh-cn, zh-tw, es, pt-br, fr, de, ja, ar, it, ko):', '輸入滑鼠靈敏度:', '"ALT + LANG" - 切換電腦上的螢幕鍵盤配置。\n"CTRL + ALT + =" - 變更第二語言。\n"CTRL + ALT + \\" - 變更滑鼠靈敏度。'],
    es: ['Introduzca la dirección IP:', 'Introduzca uno de los idiomas\n(ru, zh-cn, zh-tw, es, pt-br, fr, de, ja, ar, it, ko):', 'Introduzca la sensibilidad del ratón:', '"ALT + LANG" - cambiar la distribución en pantalla del PC.\n"CTRL + ALT + =" - cambiar el segundo idioma.\n"CTRL + ALT + \\" - cambiar la sensibilidad del ratón.'],
    'pt-br': ['Digite o endereço IP:', 'Digite um dos idiomas\n(ru, zh-cn, zh-tw, es, pt-br, fr, de, ja, ar, it, ko):', 'Digite a sensibilidade do mouse:', '"ALT + LANG" - alterar o layout na tela do PC.\n"CTRL + ALT + =" - alterar o segundo idioma.\n"CTRL + ALT + \\" - alterar a sensibilidade do mouse.'],
    fr: ['Entrez l’adresse IP :', 'Entrez une des langues\n(ru, zh-cn, zh-tw, es, pt-br, fr, de, ja, ar, it, ko) :', 'Entrez la sensibilité de la souris :', '"ALT + LANG" - changer la disposition à l’écran sur le PC.\n"CTRL + ALT + =" - changer la deuxième langue.\n"CTRL + ALT + \\" - changer la sensibilité de la souris.'],
    de: ['IP-Adresse eingeben:', 'Geben Sie eine der Sprachen ein\n(ru, zh-cn, zh-tw, es, pt-br, fr, de, ja, ar, it, ko):', 'Mausempfindlichkeit eingeben:', '"ALT + LANG" - Bildschirm-Layout auf dem PC ändern.\n"CTRL + ALT + =" - zweite Sprache ändern.\n"CTRL + ALT + \\" - Mausempfindlichkeit ändern.'],
    ja: ['IP アドレスを入力してください:', '次のいずれかの言語を入力してください\n(ru, zh-cn, zh-tw, es, pt-br, fr, de, ja, ar, it, ko):', 'マウス感度を入力してください:', '"ALT + LANG" - PC の画面レイアウトを変更します。\n"CTRL + ALT + =" - 2 番目の言語を変更します。\n"CTRL + ALT + \\" - マウス感度を変更します。'],
    ar: ['أدخل عنوان IP:', 'أدخل إحدى اللغات\n(ru, zh-cn, zh-tw, es, pt-br, fr, de, ja, ar, it, ko):', 'أدخل حساسية الماوس:', '"ALT + LANG" - تغيير تخطيط الشاشة على الكمبيوتر.\n"CTRL + ALT + =" - تغيير اللغة الثانية.\n"CTRL + ALT + \\" - تغيير حساسية الماوس.'],
    it: ['Inserisci l’indirizzo IP:', 'Inserisci una delle lingue\n(ru, zh-cn, zh-tw, es, pt-br, fr, de, ja, ar, it, ko):', 'Inserisci la sensibilità del mouse:', '"ALT + LANG" - cambia il layout dello schermo sul PC.\n"CTRL + ALT + =" - cambia la seconda lingua.\n"CTRL + ALT + \\" - cambia la sensibilità del mouse.'],
    ko: ['IP 주소를 입력하세요:', '다음 언어 중 하나를 입력하세요\n(ru, zh-cn, zh-tw, es, pt-br, fr, de, ja, ar, it, ko):', '마우스 감도를 입력하세요:', '"ALT + LANG" - PC의 화면 레이아웃을 변경합니다.\n"CTRL + ALT + =" - 두 번째 언어를 변경합니다.\n"CTRL + ALT + \\" - 마우스 감도를 변경합니다.']
};

function UpdateCurrentLang() {
	switch (CurrentLayoutLang) {
		case 'en': CurrentLayout = EnLayoutTitles; CurrentLayoutShift = EnLayoutTitlesShift; break;
		case 'ru': CurrentLayout = RuLayoutTitles; CurrentLayoutShift = RuLayoutTitlesShift; break;
		case 'zh-cn': CurrentLayout = EnLayoutTitles; CurrentLayoutShift = EnLayoutTitlesShift; break; // Hieroglyphs are entered using the Latin alphabet
		case 'zh-tw': CurrentLayout = EnLayoutTitles; CurrentLayoutShift = EnLayoutTitlesShift; break; // Hieroglyphs are entered using the Latin alphabet
		case 'es': CurrentLayout = EsLayoutTitles; CurrentLayoutShift = EsLayoutTitlesShift; break;
		case 'pt-br': CurrentLayout = PtBrLayoutTitles; CurrentLayoutShift = PtBrLayoutTitlesShift; break;
		case 'fr': CurrentLayout = FrLayoutTitles; CurrentLayoutShift = FrLayoutTitlesShift; break;
		case 'de': CurrentLayout = DeLayoutTitles; CurrentLayoutShift = DeLayoutTitlesShift; break;
		case 'ja': CurrentLayout = EnLayoutTitles; CurrentLayoutShift = EnLayoutTitlesShift; break; // Hieroglyphs are entered using the Latin alphabet
		case 'ar': CurrentLayout = ArLayoutTitles; CurrentLayoutShift = ArLayoutTitlesShift; break;
		case 'it': CurrentLayout = ItLayoutTitles; CurrentLayoutShift = ItLayoutTitlesShift; break;
		case 'ko': CurrentLayout = KoLayoutTitles; CurrentLayoutShift = KoLayoutTitlesShift; break;
	}
}

function ChangeLang() {
	if (CustomLang == 'en') return;
	CurrentLayoutLang = CurrentLayoutLang == CustomLang ? 'en' : CustomLang;
	FKeysMode = false; // при смене языка возвращаем обычные цифры
	UpdateFKeysButton();
	UpdateCurrentLang();
	ShowLayout();	
}

function UpdateFKeysButton() {
	const b = document.getElementById('topFBtn');
	if (b) b.classList.toggle('active', FKeysMode);
}

// Кнопка F1-12 в верхней панели: цифровой ряд <-> F1-F12.
// Модификаторы (Ctrl/Alt/Shift) не сбрасываем - так работают ALT + F4, CTRL + ALT + F9 и т.п.
function ToggleFKeys() {
	FKeysMode = !FKeysMode;
	UpdateFKeysButton();
	ShowLayout();
}

function UpdateModifierHighlight() {
	document.querySelectorAll('#keys .button[data-key]').forEach(b => {
		const k = b.dataset.key;
		b.classList.toggle('active',
			(k == 'CTRL' && CtrlPressed) ||
			(k == 'ALT' && AltPressed) ||
			(k == 'SHIFT' && ShiftPressed));
	});
}

function ResetModifiers() {
	if (!ShiftPressed && !CtrlPressed && !AltPressed) return;
	ShiftPressed = CtrlPressed = AltPressed = false;
	ShowLayout();
}

// Адрес сервера. Раньше Server = prompt(...) - при "Отмена" туда попадал null,
// и дальше он же подставлялся в окно как "null" и в URL запросов.
function NormalizeServer(value) {
	let v = (value || '').trim().replace(/\/+$/, '');
	if (v == '' || v == 'null') return '';
	if (!/^https?:\/\//i.test(v)) v = 'http://' + v;
	return v;
}

function AskServer() {
	const def = Server || 'http://192.168.0.1:7533';
	const value = prompt(IDS_ENTER_ADDRESS, def);
	if (value === null) return; // нажали "Отмена" - ничего не меняем
	const newServer = NormalizeServer(value);
	if (newServer == '') return;
	Server = newServer;
	localStorage.setItem('Server', Server);
	WarmUpConnection();
}

function ShowHelp() {
	alert(IDS_HELP);
}

// Холостой запрос: поднимает TCP-соединение заранее, а не на первом движении курсора
function WarmUpConnection() {
	if (Server) SendRemoteCommand('PING');
}

function SendKeyPress(key) {
	if (key == 'LANG') {
		if (AltPressed) {
			// ALT + LANG: отправляем переключение языка на ПК,
			// локальную (телефонную) раскладку НЕ трогаем
			AltPressed = false;
		} else {
			// обычный LANG (глобус): меняет отображаемую на телефоне раскладку и отправляется как раньше
			ChangeLang();
		}
	}
	if (key == 'SHIFT') {
		ShiftPressed = !ShiftPressed;
		ShowLayout();
		return;
	}
	if (key == 'CTRL') {
		CtrlPressed = !CtrlPressed;
		UpdateModifierHighlight();
		return;
	}
	if (key == 'ALT') {
		AltPressed = !AltPressed;
		UpdateModifierHighlight();
		return;
	}
	
	if (CtrlPressed) { key = 'CTRL|' + key; CtrlPressed = false; }
	if (AltPressed) { key = 'ALT|' + key; AltPressed = false; }
	if (ShiftPressed) { key = 'SHIFT|' + key; ShiftPressed = false; ShowLayout(); }
	UpdateModifierHighlight();
	
	// Hot keys
	// Mouse Sensitivity
	if (key == 'ALT|CTRL|OEM_5') {	
		let NewMouseSensitivity = prompt(IDS_ENTER_MOUSE_SENSITIVITY, MouseSensitivity);
		if (NewMouseSensitivity) {
			let NewMouseSensitivityValue = parseFloat(NewMouseSensitivity.trim());
			localStorage.setItem('MouseSensitivity', NewMouseSensitivityValue.toFixed(2));
			MouseSensitivity = NewMouseSensitivityValue;
		}
		return;
	}
	// Change second lang
	if (key == 'ALT|CTRL|OEM_PLUS') {	
		let Lang = prompt(IDS_ENTER_LANG, '');
		let allowed = ['ru', 'zh-cn', 'zh-tw', 'es', 'pt-br', 'fr', 'de', 'ja', 'ar', 'it', 'ko'];
		if (Lang && allowed.includes(Lang.trim())) {
			localStorage.setItem('Lang', Lang.trim());
			location.reload();
		}
		return;
	}
	if (key == 'SHIFT|ESC') { key = 'SHIFT|OEM_3';  }
	if (key == 'SHIFT|BACKSPACE') { key = 'OEM_3'; }

    return new Promise((resolve, reject) => {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', Server + '/keypress?key=' + encodeURIComponent(key), true);
        xhr.onreadystatechange = function () {
            if (xhr.readyState == 4) {
                if (xhr.status == 200) {
                    resolve(xhr.responseText);
                } else {
                    reject('Ошибка: ' + xhr.status);
                }
            }
        };
        xhr.send();
    });
}

function SendHotkey(key) {
    ResetModifiers();
    if (!Server) return;
    SendKeyPress(key).catch(function(){});
}

function SendRemoteCommand(cmd, onDone, timeoutMs) {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', Server + '/keypress?key=' + encodeURIComponent(cmd), true);
    xhr.timeout = timeoutMs || 3000; // зависший запрос не должен вечно занимать слот соединения
    if (onDone) xhr.onloadend = onDone; // срабатывает и при успехе, и при ошибке, и при таймауте
    xhr.send();
}

function FlushMouseMove() {
    // Предыдущие запросы ещё не ответили (холодное соединение, Wi-Fi, сервер занят):
    // не плодим очередь, а копим движение - оно уйдёт одним пакетом, и курсор не "доигрывает" старое.
    if (MouseInFlight >= MOUSE_MAX_IN_FLIGHT) return;

    const now = Date.now();
    const dt = (now - LastFlushTime) || MOUSE_FLUSH_INTERVAL;

    if (PendingDx === 0 && PendingDy === 0) {
        LastFlushTime = now;
        return;
    }
    LastFlushTime = now;

    // steps - сколько номинальных интервалов прошло. Ускорение считаем по скорости
    // за номинальный интервал, а пройденное расстояние возвращаем умножением на steps,
    // чтобы при задержке сети курсор не замедлялся, а проходил тот же путь.
    // Нижняя граница - защита от скачка при дрожании таймера сразу после рестарта.
    const steps = Math.max(dt / MOUSE_FLUSH_INTERVAL, 0.33);
    const nx = PendingDx / steps;
    const ny = PendingDy / steps;
    PendingDx = 0;
    PendingDy = 0;

    const outX = Math.round(MouseAcceleration(nx) * steps);
    const outY = Math.round(MouseAcceleration(ny) * steps);
    if (outX !== 0 || outY !== 0) {
        MouseInFlight++;
        SendRemoteCommand('MOUSEMOVE:' + -outY + ':' + outX, function() { // перевернуты
            MouseInFlight = Math.max(0, MouseInFlight - 1);
        }, 1000);
    }
}

function ApplyMode() {
    if (CurrentMode == RemoteMode) {
        KeyboardDiv.style.display = 'none';
        RemoteDiv.style.display = 'flex';
    } else {
        RemoteDiv.style.display = 'none';
        KeyboardDiv.style.display = 'flex';
    }
}

function ToggleMode() {
    ResetModifiers();
    CurrentMode = CurrentMode == KeyboardMode ? RemoteMode : KeyboardMode;
	localStorage.setItem('CurrentMode', CurrentMode);
	ApplyMode();
}

function UpdateDpadView() {
    const arrows = document.querySelectorAll('.dpad-arrow');
    arrows.forEach(a => a.style.display = TouchpadMode ? 'none' : 'flex');
    document.getElementById('dpadCenter').innerHTML = TouchpadMode ? '' : 'Enter';
    document.getElementById('dpadCenter').style.display = TouchpadMode ? 'none' : 'flex';
}

function MouseAcceleration(value) {
	let sign = value < 0 ? -1 : 1;
	value = Math.abs(value);

	// базовая чувствительность
	let result = Math.pow(value, 1.35) * MouseSensitivity;

	// ограничение максимальной скорости
	if (result > 200)
		result = 200;

	return sign * result;
}

function InitRemote() {
    RemoteDiv = document.getElementById('remote');

    document.querySelectorAll('#remote [data-cmd]').forEach(el => {
        el.onclick = () => SendRemoteCommand(el.getAttribute('data-cmd'));
    });

    document.getElementById('touchpadModeBtn').onclick = () => {
        TouchpadMode = !TouchpadMode;
		localStorage.setItem('TouchpadMode', TouchpadMode);
        UpdateDpadView();
    };
    document.getElementById('backToKeyboardBtn').onclick = ToggleMode;

    const dpadCenter = document.getElementById('dpadCenter');
    dpadCenter.onclick = () => {
        if (!TouchpadMode) SendRemoteCommand('ENTER');
    };
    ['n', 's', 'w', 'e'].forEach((dir, i) => {
        const keys = ['UP', 'DOWN', 'LEFT', 'RIGHT'];
        document.querySelector('.dpad-arrow.' + dir).onclick = () => {
            if (!TouchpadMode) SendRemoteCommand(keys[i]);
        };
    });

    const dpad = document.getElementById('dpad');
    dpad.addEventListener('touchstart', function(e) {
        if (!TouchpadMode) return;
        LastTouchX = e.touches[0].clientX;
        LastTouchY = e.touches[0].clientY;
        TouchMoved = false;
        JustStarted = true;
        PendingDx = 0;
        PendingDy = 0;
        LastFlushTime = Date.now();
        if (MouseMoveTimer) clearInterval(MouseMoveTimer);
        MouseMoveTimer = setInterval(FlushMouseMove, MOUSE_FLUSH_INTERVAL);

        if (DragHoldTimer) clearTimeout(DragHoldTimer);
        DragActive = false;
        DragHoldTimer = setTimeout(function() {
            DragHoldTimer = null;
            DragActive = true;
            TouchMoved = true; // палец лежал на месте — это не тап, клик по touchend не нужен
            if (navigator.vibrate) navigator.vibrate(15);
            dpad.classList.add('dragging');
            SendRemoteCommand('MOUSEDOWN');
        }, DRAG_HOLD_DELAY);
    }, {passive: true});
    dpad.addEventListener('touchmove', function(e) {
        if (!TouchpadMode) return;
        const x = e.touches[0].clientX;
        const y = e.touches[0].clientY;
        const dx = x - LastTouchX;
        const dy = y - LastTouchY;
        LastTouchX = x;
        LastTouchY = y;
        if (JustStarted) {
            // первое движение после касания часто прилетает одним "скачком"
            // (браузер проглатывает начальный слоп) - просто синхронизируем
            // позицию, не отправляя эту дельту курсору
            JustStarted = false;
            return;
        }
        if (Math.abs(dx) > 2 || Math.abs(dy) > 2) TouchMoved = true;
        // реальное движение раньше срабатывания таймера - это обычный свайп, а не зажатие
        if (DragHoldTimer && (Math.abs(dx) > DRAG_MOVE_TOLERANCE || Math.abs(dy) > DRAG_MOVE_TOLERANCE)) {
            clearTimeout(DragHoldTimer);
            DragHoldTimer = null;
        }
        PendingDx += dx;
        PendingDy += dy;
    }, {passive: true});
    function StopMouseMoveTimer() {
        if (MouseMoveTimer) {
            clearInterval(MouseMoveTimer);
            MouseMoveTimer = null;
        }
        JustStarted = false;
        PendingDx = 0;
        PendingDy = 0;
    }
    function EndDragHold() {
        if (DragHoldTimer) {
            clearTimeout(DragHoldTimer);
            DragHoldTimer = null;
        }
        if (DragActive) {
            DragActive = false;
            dpad.classList.remove('dragging');
            SendRemoteCommand('MOUSEUP');
            return true;
        }
        return false;
    }
    dpad.addEventListener('touchend', function(e) {
        if (!TouchpadMode) { StopMouseMoveTimer(); return; }
        StopMouseMoveTimer();
        const wasDragging = EndDragHold();
        if (!wasDragging && !TouchMoved) SendRemoteCommand('MOUSECLICK');
    });
    dpad.addEventListener('touchcancel', function(e) {
        StopMouseMoveTimer();
        EndDragHold();
    });
    // Подстраховка: если приложение свернули посреди зажатия, не оставляем ЛКМ "залипшей"
    document.addEventListener('visibilitychange', function() {
        if (document.hidden) EndDragHold();
    });

    const scrollpad = document.getElementById('scrollpad');
    scrollpad.addEventListener('touchstart', function(e) {
        LastScrollY = e.touches[0].clientX;
        ScrollAccum = 0;
    }, {passive: true});
	scrollpad.addEventListener('touchmove', function(e) {
		const y = e.touches[0].clientX;
		const dy = LastScrollY - y;
		LastScrollY = y;
		const accelDy = MouseAcceleration(dy);
		ScrollAccum += accelDy;
		while (Math.abs(ScrollAccum) >= ScrollThreshold) {
			const notch = ScrollAccum > 0 ? 1 : -1;
			SendRemoteCommand('SCROLL:' + notch);
			ScrollAccum -= notch * ScrollThreshold;
		}
}, {passive: true});
	scrollpad.addEventListener('touchend', function(e) {
		ScrollAccum = 0;
	});
    UpdateDpadView();
}

function ShowLayout() {
    KeysDiv.innerHTML = '';
    EnLayout.forEach((rowKeys, rowIndex) => {
        const rowDiv = document.createElement('div');
        rowDiv.classList.add('row');
        rowKeys.forEach((key, keyIndex) => {
            const button = document.createElement('div');
			button.setAttribute('class', 'button');
			// Режим F1-F12: клавиши 1..= (индексы 1-12 в верхнем ряду) становятся F1..F12
			const isFKey = FKeysMode && rowIndex == 0 && keyIndex >= 1 && keyIndex <= 12;
			if (isFKey) {
				key = 'F' + keyIndex;
				button.innerHTML = key;
			} else if (ShiftPressed == false)
				button.innerHTML = CurrentLayout[rowIndex][keyIndex];
			else
				button.innerHTML = CurrentLayoutShift[rowIndex][keyIndex];
			if (rowIndex == 0) {
				if (keyIndex == 0) button.style.flexGrow = 1.25; // Escape
				else if (keyIndex == 13) button.style.flexGrow = 1.75; // Backspace
			} else if (rowIndex == 1) {
				if (keyIndex == 0) button.style.flexGrow = 1.5; // Tab
				else if (keyIndex == 13) button.style.flexGrow = 1.5; // \
			} else if (rowIndex == 2) {
				if (keyIndex == 0) button.style.flexGrow = 2; // Caps Lock
				else if (keyIndex == 12) button.style.flexGrow = 2; // Enter
			} else if (rowIndex == 3) {
				if (keyIndex == 0) button.style.flexGrow = 2.5; // Shift (левый)
				else if (keyIndex == 11) button.style.flexGrow = 2.5; // Shift (правый)
			} else if (rowIndex == 4) {
				// Ctrl, Win, Alt, Lang
				if (keyIndex == 0 || keyIndex == 1 || keyIndex == 2 || keyIndex == 3) button.style.flexGrow = 1.0;
				else if (keyIndex == 4) button.style.flexGrow = 5; // Space
				else if (keyIndex == 9) button.style.flexGrow = 1.0; // Delete
				
				// Icons
				if (keyIndex == 1) button.innerHTML = '<img src="images/win.png">'; // Win
				else if (keyIndex == 3) button.innerHTML = '<img src="images/lang.png">'; // Lang
			}
            button.alt = key;
            button.dataset.key = key;
            button.onclick = () => SendKeyPress(key);
            rowDiv.appendChild(button);
        });
        if (rowIndex == 4) {
            const modeBtn = document.createElement('div');
            modeBtn.classList.add('button');
            modeBtn.innerHTML = '<img style="max-width:23px; max-height:23px;" src="images/remote_control.png">';
            modeBtn.onclick = ToggleMode;
            rowDiv.insertBefore(modeBtn, rowDiv.children[4]); // перед пробелом
        }
        KeysDiv.appendChild(rowDiv);
    });
    UpdateModifierHighlight();
}

function InitTopBar() {
    document.getElementById('topHelpBtn').onclick = ShowHelp;
    document.getElementById('topAddressBtn').onclick = AskServer;

    document.querySelectorAll('[data-action]').forEach(function(el) {
        el.onclick = function() {
            switch (el.dataset.action) {
                case 'close':
                    if (window.Android && Android.closeApp) Android.closeApp();
                    break;
                case 'minimize':
                    if (window.Android && Android.minimizeApp) Android.minimizeApp();
                    break;
            }
        };
    });

    // закрыть / свернуть / адрес имеют смысл только в Android-приложении
    if (!IsAndroid)
        document.querySelectorAll('.android-only').forEach(el => el.style.display = 'none');
	else
        document.querySelectorAll('.ios-only').forEach(el => el.style.display = 'none');
}

function UpdateRemoteClock() {
	const now = new Date();
	const hh = String(now.getHours()).padStart(2, '0');
	const mm = String(now.getMinutes()).padStart(2, '0');
	document.querySelectorAll('.clock').forEach(el => el.textContent = hh + ':' + mm);
}

document.addEventListener('DOMContentLoaded', function(){
	KeyboardDiv = document.getElementById('keyboard');
	KeysDiv = document.getElementById('keys');

	UpdateRemoteClock();
	setInterval(UpdateRemoteClock, 1000);
	document.addEventListener('visibilitychange', function() {
		if (document.hidden) ResetModifiers();
	});

	if (localStorage.getItem('Lang') == null) {
		let lang = navigator.language.toLowerCase();

		if (lang.startsWith('ru')) CustomLang = 'ru';
		else if (lang.startsWith('zh')) CustomLang = (lang.includes('tw') || lang.includes('hant') || lang.includes('hk') || lang.includes('mo')) ? 'zh-tw' : 'zh-cn';
		else if (lang.startsWith('es')) CustomLang = 'es';
		else if (lang.startsWith('pt')) CustomLang = 'pt-br';
		else if (lang.startsWith('fr')) CustomLang = 'fr';
		else if (lang.startsWith('de')) CustomLang = 'de';
		else if (lang.startsWith('ja')) CustomLang = 'ja';
		else if (lang.startsWith('ar')) CustomLang = 'ar';
		else if (lang.startsWith('it')) CustomLang = 'it';
		else if (lang.startsWith('ko')) CustomLang = 'ko';
		localStorage.setItem('Lang', CustomLang);
	} else
		CustomLang = localStorage.getItem('Lang');

	if (CustomLang != 'en') {
		CurrentLayoutLang = CustomLang;
		IDS_ENTER_ADDRESS = LangStrings[CustomLang][0];
		IDS_ENTER_LANG = LangStrings[CustomLang][1];
		IDS_ENTER_MOUSE_SENSITIVITY = LangStrings[CustomLang][2];
		IDS_HELP = LangStrings[CustomLang][3];
	}
	
	if (localStorage.getItem('TouchpadMode') != null)
		TouchpadMode = localStorage.getItem('TouchpadMode') === 'true';
	
	UpdateCurrentLang();
	ShowLayout();
	InitRemote();
	InitTopBar();
	
	if (localStorage.getItem('MouseSensitivity') != null)
		MouseSensitivity = parseFloat(localStorage.getItem('MouseSensitivity'));
		
	if (localStorage.getItem('CurrentMode') != null)
		CurrentMode = parseInt(localStorage.getItem('CurrentMode'));
	ApplyMode();
	
	if (IsAndroid) {
		// Сохранённый адрес читаем сразу (раньше он появлялся только через 500 мс -
		// касания в это время уходили на file:///keypress в никуда)
		Server = NormalizeServer(localStorage.getItem('Server'));
		if (Server)
			WarmUpConnection();
		else
			setTimeout(AskServer, 500); // адреса ещё нет - спрашиваем после первой отрисовки
	} else { // для iOS
		window.addEventListener('resize', function() {
			ShowLayout();
			ApplyMode();
		});
	}
});
</script>
